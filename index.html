<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="СКВОТ — прямая аренда жилья без посредников" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <!-- Шрифты подключаем отсюда (preconnect + stylesheet), а не @import в CSS:
         @import блокирует применение всего остального CSS до ответа стороннего origin -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
    />
    <title>СКВОТ — аренда без посредников</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
